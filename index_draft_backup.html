<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marina Speaks RP</title>
<style>
  :root {
    --ink: #1B1C1F;
    --paper: #F7F4EE;
    --signal: #C41E1E;
    --slate: #545B6B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 480px; }
  .mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--signal);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  p {
    color: var(--slate);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="mark"></span>
    <h1>Marina Speaks RP</h1>
    <p>Страница готовится. Скоро здесь появится марафон британского произношения.</p>
  </div>
</body>
</html>
